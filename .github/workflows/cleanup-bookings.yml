name: Booking Maintenance

on:
  schedule:
    - cron: '0 0 * * 0'  # Sunday at midnight UTC
  workflow_dispatch: {}   # Allow manual trigger

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile sheet/calendar drift
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          CLEANUP_KEY: ${{ secrets.CLEANUP_KEY }}
        run: |
          # Cancel any confirmed booking whose calendar event was deleted/moved
          # out-of-band, so ghost rows stop blocking future slots. Idempotent.
          # The key goes in the POST body (never the URL), so it isn't logged or
          # forwarded to another host on Apps Script's redirect.
          RESPONSE=$(curl -sS -L -X POST \
            -H 'Content-Type: text/plain;charset=utf-8' \
            --data "$(jq -nc --arg k "$CLEANUP_KEY" '{action:"reconcile", key:$k}')" \
            "$APPS_SCRIPT_URL")
          echo "Response: $RESPONSE"
          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
          if [ "$SUCCESS" != "true" ]; then
            echo "Reconcile failed"
            exit 1
          fi
          echo "Reconciled $(echo "$RESPONSE" | jq -r '.reconciled') ghost booking(s)"

      - name: Delete bookings older than 30 days
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          CLEANUP_KEY: ${{ secrets.CLEANUP_KEY }}
        run: |
          RESPONSE=$(curl -sS -L -X POST \
            -H 'Content-Type: text/plain;charset=utf-8' \
            --data "$(jq -nc --arg k "$CLEANUP_KEY" '{action:"cleanup", key:$k}')" \
            "$APPS_SCRIPT_URL")
          echo "Response: $RESPONSE"
          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
          if [ "$SUCCESS" != "true" ]; then
            echo "Cleanup failed"
            exit 1
          fi
          DELETED=$(echo "$RESPONSE" | jq -r '.deleted')
          echo "Deleted $DELETED old bookings"
