<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancel Booking</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="lib/js-yaml.min.js"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Cancel Booking</h1>
    </header>

    <section class="step-content active">
      <div id="cancel-content" class="confirmation-box">
        <p>Loading booking details…</p>
      </div>
    </section>

    <div id="loading" class="loading-overlay" aria-hidden="true">
      <div class="spinner"></div>
      <p>Cancelling...</p>
    </div>

    <div id="error-banner" class="error-banner" role="alert" aria-live="polite"></div>
  </div>

  <script src="js/config-loader.js"></script>
  <script src="js/timezone.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/cancel.js"></script>
  <script>
    // Cancellation is gated behind an explicit confirm click inside CancelPage \u2014
    // it must never run on page load, or email link-scanners will cancel bookings.
    CancelPage.init();
  </script>
</body>
</html>
